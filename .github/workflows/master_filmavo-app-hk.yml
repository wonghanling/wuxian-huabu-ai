# Build and deploy Next.js app to Azure Web App - filmavo-app-hk

name: Build and deploy Node.js app to Azure Web App - filmavo-app-hk

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone output)
        run: npm run build
        env:
          NEXT_PUBLIC_BRAND: filmavo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${{ secrets.NEXT_PUBLIC_TLDRAW_LICENSE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALIPAY_APP_ID: dummy_for_build
          ALIPAY_PRIVATE_KEY: dummy_for_build
          ALIPAY_PUBLIC_KEY: dummy_for_build
          VOLC_ACCESS_KEY_ID: dummy_for_build
          VOLC_SECRET_ACCESS_KEY: dummy_for_build
          FAL_KEY: dummy_for_build

      - name: Assemble standalone deploy folder
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          if [ -d public ]; then cp -r public deploy/; fi

      - name: Zip standalone artifact
        run: cd deploy && zip -r ../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'filmavo-app-hk'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6802466E1EDA41C18B04C4B6E6056EF3 }}
